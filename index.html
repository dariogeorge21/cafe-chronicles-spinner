<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cafe Chronicles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="fx"></canvas>

  <header>
    <h1>Cafe<br>Chronicles</h1>
    <p class="tag">Spin the wheel and taste your luck.</p>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="rim" id="rim"></div>
      <div class="disc"><canvas id="wheel"></canvas></div>
      <div class="hub" aria-hidden="true">
        <svg class="hub-icon" viewBox="0 0 24 24" fill="none" stroke="#3d2204" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
          <line x1="6" y1="2" x2="6" y2="4"></line>
          <line x1="10" y1="2" x2="10" y2="4"></line>
          <line x1="14" y1="2" x2="14" y2="4"></line>
        </svg>
      </div>
      <svg class="pointer" viewBox="0 0 40 52" aria-hidden="true">
        <path d="M20 50 L3 14 A18 18 0 1 1 37 14 Z" fill="#ff6b4a" stroke="#fff3d6" stroke-width="3"/>
        <circle cx="20" cy="17" r="5" fill="#fff3d6"/>
      </svg>
    </div>

    <button class="spin" id="spin">Spin the wheel</button>

    <section class="card">
      <h3>Spin history <button class="link" id="clear">Clear</button></h3>
      <ul id="hist"></ul>
    </section>

    <section class="card">
      <h3>Prize tally <span id="total" style="font:500 .9rem 'DM Sans',sans-serif;color:var(--muted)"></span></h3>
      <div id="tally"></div>
    </section>
  </main>

  <!-- Result Modal -->
  <div class="modal-overlay" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="modal-headline" aria-hidden="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Close dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="modal-badge" id="modal-badge"></div>
      <div class="modal-tag" id="modal-tag">Reward</div>
      <h2 class="modal-title" id="modal-headline">Brosted Chicken</h2>
      <div class="modal-sub" id="modal-sub">Crunch Time Winner</div>
      <p class="modal-desc" id="modal-desc"></p>

      <div class="modal-voucher" id="modal-voucher">
        <div class="voucher-swatch" id="voucher-swatch"></div>
        <div class="voucher-info">
          <span class="voucher-label" id="voucher-label">Complimentary Reward</span>
          <span class="voucher-title" id="voucher-title">Brosted Chicken</span>
        </div>
        <span class="voucher-badge">Free</span>
      </div>

      <div class="modal-actions">
        <button class="modal-btn primary" id="modal-primary-btn">Spin Again</button>
        <button class="modal-btn secondary" id="modal-secondary-btn">Close</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
